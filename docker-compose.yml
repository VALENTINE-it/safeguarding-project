services:
  backend:
    build:
      context: ./my-app/backend-go
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_PATH=/app/data/safeguarding.db
      - JWT_SECRET=safeguarding_secret_key_2026
    volumes:
      - db_data:/app/data

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  db_data:
